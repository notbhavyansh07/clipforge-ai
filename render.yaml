services:
  # 1. FastAPI Python Backend Service
  - type: web
    name: clipforge-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PROJECT_NAME
        value: "ClipForge AI"
      - key: DATABASE_URL
        value: "sqlite:///./clipforge.db"

  # 2. Next.js Frontend Service
  - type: web
    name: clipforge-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: PORT
        value: 10000
      - key: NEXT_PUBLIC_API_URL
        value: https://clipforge-backend.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://clipforge-frontend-04i1.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_ACCOUNT_ID
        sync: false
      - key: BACKEND_INTERNAL_URL
        fromService:
          type: web
          name: clipforge-backend
          property: host
